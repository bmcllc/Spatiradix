[package]
name = "mycelium-meta-gateway"
description = "Supreme Meta-Gateway: orquestrador financeiro descentralizado (Pix EMV/DICT cob/cobv + mTLS, SWIFT CSP A1-B + HSM, BRICS Pay DCMS MT103, PKARR, SporeBank e Webhooks Axum)"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
publish = false

[features]
default = ["pix", "swift", "brics"]
pix = ["dep:xml-rs"]
pix-privacy-lab = ["pix", "dep:mycelium-veil", "dep:mycelium-qel"]
pix-pay-lab = ["pix-privacy-lab"]
swift = []
brics = []

[dependencies]
mycelium-core = { workspace = true }
mycelium-mint = { workspace = true }
mycelium-keyring = { path = "../mycelium-keyring" }
mycelium-zkp = { workspace = true }
mycelium-pqc = { workspace = true }
mycelium-pkarr = { workspace = true }
mycelium-bank = { workspace = true }
mycelium-pay = { workspace = true }
mycelium-sporebank = { workspace = true }
giggs = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
subtle = "2"
tempfile = "3"
chacha20poly1305 = "0.10"
zeroize = "1"

xml-rs = { version = "=0.8.28", optional = true }

mycelium-veil = { workspace = true, optional = true }
mycelium-qel = { workspace = true, optional = true }

[dev-dependencies]
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }

[[example]]
name = "pix_privacy_lab"
required-features = ["pix-privacy-lab"]

[[example]]
name = "pix_pay_lab"
required-features = ["pix-pay-lab"]

[[example]]
name = "pix_interop_lab"
required-features = ["pix"]

[[example]]
name = "pix_mtls_lab"
required-features = ["pix"]
