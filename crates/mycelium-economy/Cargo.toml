[package]
name = "mycelium-economy"
version = "0.1.0"
edition = "2021"
license.workspace = true
license-file.workspace = true
description = "Local-first Mycelium job market, revenue ledger and RV validation"

# The empty [workspace] table that kept this crate isolated until its RV0 data
# contract was stable has been removed; it now participates in the root workspace.

[dependencies]
serde = { version = "1", features = ["derive"] }
mycelium-mint = { workspace = true }
serde_json = "1"
thiserror = "2"
blake3 = "1.8"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"

# P4 authenticated policy + receipts. Two distinct ed25519 roles: the policy
# authority signs policies, the verifier runtime signs attestations. Neither key
# ever travels inside the artefact it authorises.
ed25519-dalek.workspace = true
# `ed25519-dalek`'s `rand_core` feature is rand_core 0.6, which is the same
# rand_core the workspace's `rand 0.8` is built on, so `SigningKey::random`
# accepts `rand::rngs::OsRng` without a second RNG stack.
rand.workspace = true

# Read-only local JSON-RPC adapter. No signing/broadcast methods are implemented.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
libc = "0.2"

[dev-dependencies]
mycelium-core = { workspace = true }
mycelium-nutrients = { workspace = true }

[[bin]]
name = "mycelium-economy"
path = "src/bin/mycelium-economy.rs"

[[bin]]
name = "mycelium-cqr-worker"
path = "src/bin/mycelium-cqr-worker.rs"

