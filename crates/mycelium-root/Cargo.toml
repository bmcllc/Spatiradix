[package]
name = "mycelium-root"
description = "Root: nuvem sem servidor e sem P2P — cofre cifrado, Reed-Solomon K-de-N e chave Shamir espalhados pelos seus meios físicos, sincronizados por contato e montáveis como pendrive"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true

[dependencies]
entropy = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
reed-solomon-erasure = "6"
fuser = { version = "0.15", default-features = false, optional = true }
libc = "0.2"

[features]
default = ["mount"]
mount = ["dep:fuser"]
