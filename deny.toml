# Supply-chain gate (spec Sovereign Finance §12, G0). Rodar: scripts/supply_chain.sh
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# unmaintained transitivos (bincode, paste, instant…) viram aviso do cargo-audit; só os diretos bloqueiam
unmaintained = "workspace"
# mesmos ignores e motivos de .cargo/audit.toml
ignore = ["RUSTSEC-2026-0258", "RUSTSEC-2026-0119", "RUSTSEC-2026-0118", "RUSTSEC-2026-0387", "RUSTSEC-2021-0154"]

[licenses]
version = 2
allow = [
  "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later",
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Zlib", "MPL-2.0", "BSL-1.0",
  "CDLA-Permissive-2.0", "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow" # só deps internas por path/workspace; registry com versão

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
